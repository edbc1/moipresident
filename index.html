<style>
  /* Marianne: official French government typeface (via DSFR) */
  @font-face {
    font-family: "Marianne";
    src: url("https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Marianne";
    src: url("https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-Medium.woff2") format("woff2");
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Marianne";
    src: url("https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-Bold.woff2") format("woff2");
    font-weight: 600 700; font-style: normal; font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #161616;
    --paper: #f7f6f2;
    --mute: #9a9a9a;
    --line: #e6e4de;
    --pop-w: min(400px, calc(100vw - 32px));
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--paper);
    background-image: radial-gradient(ellipse at 50% 42%, #ffffff 0%, var(--paper) 62%, #edece7 100%);
    color: var(--ink);
    font-family: "Marianne", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    letter-spacing: -0.01em;
  }


  /* masthead: kicker above, big title below */
  .masthead {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 40; pointer-events: none;
    transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .masthead .m-kicker {
    font-size: 10px; color: var(--mute); letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 5px;
  }
  .masthead .m-title {
    font-family: "Marianne", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 26px; font-weight: 600; letter-spacing: -0.02em;
    color: #111111; line-height: 1.1;
  }
  @media (max-width: 1020px) {
    .masthead { left: 36px; transform: none; text-align: left; }
    .masthead .m-title { font-size: 21px; }
  }

  /* language toggle */
  .lang {
    position: fixed; bottom: 30px; left: 36px; z-index: 60;
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 11px; letter-spacing: 0.08em;
    color: var(--ink); padding: 4px 0;
    border-bottom: 1px solid transparent;
  }
  .lang:hover { border-bottom-color: var(--ink); }

  /* sources */
  /* below the panel (z 50) so an open panel covers it */
  .sources { position: fixed; bottom: 30px; right: 36px; z-index: 45; }
  .sources .s-btn {
    font-family: inherit; font-size: 11px; letter-spacing: 0.08em;
    color: var(--ink); padding: 4px 0; cursor: default;
    border-bottom: 1px solid transparent;
  }
  .sources:hover .s-btn { border-bottom-color: var(--ink); }
  .sources .s-pop {
    position: absolute; bottom: 26px; right: 0; width: 330px;
    background: var(--paper); border: 1px solid var(--line);
    padding: 16px 18px; text-align: left;
    opacity: 0; visibility: hidden; transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    max-height: 60vh; overflow-y: auto;
  }
  .sources:hover .s-pop { opacity: 1; visibility: visible; transform: translateY(0); }
  .s-pop h4 {
    font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--mute); font-weight: 500; margin-bottom: 8px;
  }
  .s-pop h4:not(:first-child) { margin-top: 14px; }
  .s-pop ul { list-style: none; }
  .s-pop li { font-size: 11px; line-height: 1.5; padding: 3px 0; }
  .s-pop li a {
    color: #3a3733; text-decoration: none;
    transition: color 0.15s ease;
  }
  .s-pop li a:hover { color: var(--ink); }
  .s-pop li a::after {
    content: "↗"; font-size: 8px; margin-left: 4px;
    color: var(--mute); vertical-align: 1px;
  }
  .s-pop .note {
    font-size: 10px; line-height: 1.5; color: var(--mute);
    margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line);
  }

  /* canvas + label layer */
  #scene { position: fixed; inset: 0; cursor: grab; }
  #scene.dragging { cursor: grabbing; }
  #tags { position: fixed; inset: 0; pointer-events: none; }
  .tag {
    position: absolute; left: 0; top: 0;
    background: #161616; color: #f7f6f2;
    font-size: 10px; letter-spacing: 0.02em;
    padding: 3px 8px 4px; white-space: nowrap;
    pointer-events: auto; cursor: pointer;
    will-change: transform, opacity;
    transition: background 0.15s ease;
    user-select: none;
  }
  .tag:hover { background: #000; }
  .tag.sel { outline: 1px solid #161616; outline-offset: 2px; }
  .tag .n { color: #8f8f8f; margin-right: 6px; }
  .tag .tick { display: none; margin-left: 6px; color: #b9b5ab; font-size: 9px; }
  .tag.read .tick { display: inline; }

  /* spend counter */
  .counter {
    position: fixed; top: 26px; right: 36px; width: 232px; z-index: 320;
  }
  .counter .c-label {
    font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--mute); margin-bottom: 5px; min-height: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .counter.pillar .c-label { color: var(--ink); }
  .counter { transition: opacity 0.25s ease; }
  .g-row { margin-top: 8px; }
  .g-tag {
    display: block; font-size: 8.5px; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--mute); margin-bottom: 3px;
  }
  .counter .gauge {
    height: 30px; border-radius: 8px;
    background: rgba(0,0,0,0.045); border: 1px solid var(--line);
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: flex-end;
  }
  .counter .gauge .fill {
    position: absolute; top: 0; left: 0; height: 100%;
    background: #ddd9d0; border-radius: 8px; min-width: 6px;
    transition: width 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .counter .gauge.gain .fill { background: #cfd6cd; }
  .counter .gauge .g-max {
    position: relative; z-index: 1; padding-right: 12px;
    font-size: 12px; font-weight: 500; color: #57544c; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* context panel */
  /* pillar window, tethered below the clicked node */
  .panel {
    position: fixed; top: 0; left: 0; width: var(--pop-w);
    background: rgba(247, 246, 242, 0.97);
    backdrop-filter: blur(7px);
    border: 1px solid var(--line);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.07);
    z-index: 300; padding: 14px 16px 18px;
    max-height: 62vh; overflow-y: auto;
    opacity: 0; visibility: hidden;
    transform-origin: 50% 0;
    transition: opacity 0.28s ease, visibility 0.28s;
    will-change: transform;
  }
  .panel.open { opacity: 1; visibility: visible; }
  .panel .eyebrow {
    font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--mute); margin-bottom: 5px;
  }
  .panel h1 {
    font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
    line-height: 1.2; margin-bottom: 10px;
  }
  .points { list-style: none; counter-reset: pt; }
  .points li {
    counter-increment: pt;
    display: grid; grid-template-columns: 20px 1fr;
    gap: 10px; padding: 5px 0;
    font-size: 12px; line-height: 1.5;
  }
  .points li::before {
    content: counter(pt, decimal-leading-zero);
    font-size: 10px; color: var(--mute); padding-top: 2px;
  }

  ::selection { background: #161616; color: #fff; }

  /* intro / typewriter */
  .intro {
    position: fixed; inset: 0; z-index: 500;
    background: var(--paper);
    background-image: radial-gradient(ellipse at 50% 45%, #ffffff 0%, var(--paper) 62%, #edece7 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 40px;
    transition: opacity 0.9s ease, visibility 0.9s;
  }
  .intro.done { opacity: 0; visibility: hidden; pointer-events: none; }
  .intro-text {
    font-size: clamp(22px, 3.4vw, 40px);
    line-height: 1.3; letter-spacing: -0.02em;
    color: var(--ink); max-width: 18em; text-align: center;
  }
  .intro-text .l1 {
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-style: italic; font-weight: 400;
    font-size: 1.12em; letter-spacing: -0.01em;
    margin-bottom: 0.2em;
  }
  .intro-text .l2 { font-weight: 500; }
  .cur {
    display: none; width: 0.06em; height: 1em; margin-left: 0.04em;
    background: var(--ink); vertical-align: -0.12em;
    animation: blink 1s steps(1) infinite;
  }
  .cur.on { display: inline-block; }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

  /* tricolore: deliberately flattened, long and low, not a 2:3 flag */
  .flag {
    display: flex; width: 132px; height: 5px;
    margin: 2.4em auto 0;
    border: 1px solid rgba(0, 0, 0, 0.07);
    opacity: 0; transition: opacity 0.7s ease;
  }
  .flag.in { opacity: 1; }
  .flag span { flex: 1; }
  .flag .b { background: #000091; }
  .flag .w { background: #ffffff; }
  .flag .r { background: #e1000f; }

  /* everything behind the intro fades in once it clears.
     Faded per-element, not via a wrapper: an ancestor with opacity < 1 would
     become the containing block for these position:fixed children. */
  .masthead, .lang, .sources, .counter, #scene, #tags {
    transition: opacity 0.9s ease;
  }
  body.booting .masthead, body.booting .lang,
  body.booting .sources, body.booting .counter,
  body.booting #scene, body.booting #tags { opacity: 0; }
</style>
</head>
<body class="booting">
  <div class="intro" id="intro">

  <header class="masthead">

// --- nodes: 30 pillar nodes (fibonacci sphere) + decorative nodes ---
function fib(i, n) {
  const g = Math.PI * (3 - Math.sqrt(5));
  const y = 1 - (i / (n - 1)) * 2;
  const r = Math.sqrt(1 - y * y);
  const a = g * i;
  return { x: Math.cos(a) * r, y, z: Math.sin(a) * r };
}
// deterministic pseudo-random
let seed = 42;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

// pillars grouped by axe: 6 cluster centers, each axe's pillars form a cap around its center
const nodes = [];
{
  const AXE_ORDER = ["I","II","III","IV","V","VI"];
  const norm = v => { const L = Math.hypot(v.x, v.y, v.z); return { x: v.x/L, y: v.y/L, z: v.z/L }; };
  const cross = (a, b) => ({ x: a.y*b.z - a.z*b.y, y: a.z*b.x - a.x*b.z, z: a.x*b.y - a.y*b.x });
  AXE_ORDER.forEach((ax, ci) => {
    const c = fib(ci, 6);
    const up = Math.abs(c.y) > 0.9 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 1, z: 0 };
    const u = norm(cross(up, c));
    const v = cross(c, u);
    const members = [];
    PILLARS.forEach((p, i) => { if (p.axis === ax) members.push(i); });
    members.forEach((pi, j) => {
      if (j === 0) { nodes[pi] = { ...c, pillar: pi, rad: 1 }; return; }
      const a = 0.40; // cap angular radius
      const phi = (2 * Math.PI * (j - 1)) / (members.length - 1) + ci * 0.7;
      const ca = Math.cos(a), sa = Math.sin(a), cf = Math.cos(phi), sf = Math.sin(phi);
      nodes[pi] = {
        x: ca * c.x + sa * (cf * u.x + sf * v.x),
        y: ca * c.y + sa * (cf * u.y + sf * v.y),
        z: ca * c.z + sa * (cf * u.z + sf * v.z),
        pillar: pi, rad: 1
      };
    });
  });
}
// decorative nodes: on the sphere surface, filling the gaps
for (let i = 0; i < 70; i++) {
  const p = fib(i, 70);
  const j = 0.18;
  let x = p.x + (rnd() - 0.5) * j, y = p.y + (rnd() - 0.5) * j, z = p.z + (rnd() - 0.5) * j;
  const L = Math.hypot(x, y, z); x /= L; y /= L; z /= L;
  nodes.push({ x, y, z, pillar: -1, rad: 1 });
}

// --- edges: k nearest neighbors → connected triangulated mesh ---
const edges = [];
{
  const seen = new Set();
  const add = (ia, ib) => {
    const key = ia < ib ? ia + "-" + ib : ib + "-" + ia;
    if (!seen.has(key)) { seen.add(key); edges.push([ia, ib]); }
  };
  nodes.forEach((a, ia) => {
    const dists = nodes.map((b, ib) => ({ ib, d: (a.x-b.x)**2 + (a.y-b.y)**2 + (a.z-b.z)**2 }))
      .filter(o => o.ib !== ia).sort((p, q) => p.d - q.d);
    const k = a.pillar >= 0 ? 2 : 8; // dense mesh between deco nodes, light anchoring for pillars
    for (let n = 0; n < k; n++) add(ia, dists[n].ib);
  });
  // pillars of the same axe: perimeter ring only (no hub spokes, too messy)
  const byAxe = {};
  PILLARS.forEach((p, i) => (byAxe[p.axis] = byAxe[p.axis] || []).push(i));
  Object.values(byAxe).forEach(m => {
    for (let j = 1; j < m.length; j++) add(m[j], m[j === m.length - 1 ? 1 : j + 1]);
  });

}

  el.className = "tag" + (read.has(i) ? " read" : "");
  el.innerHTML = tagHTML(i);
  el.addEventListener("click", (e) => { e.stopPropagation(); select(i); });
  tagLayer.appendChild(el);
  tags.push(el);
});
function markRead(i) {
  if (read.has(i)) return;
  read.add(i);
  tags[i].classList.add("read");
  try { localStorage.setItem("readPillars", JSON.stringify([...read])); } catch (e) {}
}

// --- rotation state: quaternion trackball (no pole, no gimbal lock, endless drag) ---
function qmul(a, b) {
  return [
    a[0]*b[0] - a[1]*b[1] - a[2]*b[2] - a[3]*b[3],
    a[0]*b[1] + a[1]*b[0] + a[2]*b[3] - a[3]*b[2],
    a[0]*b[2] - a[1]*b[3] + a[2]*b[0] + a[3]*b[1],
    a[0]*b[3] + a[1]*b[2] - a[2]*b[1] + a[3]*b[0]
  ];
}
function qaxis(ax, ay, az, ang) {
  const h = ang / 2, s = Math.sin(h);
  return [Math.cos(h), ax * s, ay * s, az * s];
}
function qnorm(q) { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return q.map(v => v / l); }
function qapply(q, p) {
  const [w, x, y, z] = q;
  const tx = 2 * (y * p.z - z * p.y);
  const ty = 2 * (z * p.x - x * p.z);
  const tz = 2 * (x * p.y - y * p.x);
  return {
    x: p.x + w * tx + (y * tz - z * ty),
    y: p.y + w * ty + (z * tx - x * tz),
    z: p.z + w * tz + (x * ty - y * tx)
  };
}
function qslerp(a, b, t) {
  let d = a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3];
  if (d < 0) { b = b.map(v => -v); d = -d; }
  if (d > 0.9995) return qnorm(a.map((v, i) => v + (b[i] - v) * t));
  const th = Math.acos(d), s = Math.sin(th);
  return a.map((v, i) => (v * Math.sin((1 - t) * th) + b[i] * Math.sin(t * th)) / s);
}

let q = qmul(qaxis(1, 0, 0, -0.18), qaxis(0, 1, 0, 0.6));
const AUTO = 0.0016;
let dragging = false, lastX = 0, lastY = 0, moved = 0;
let sel = null;
let anim = null; // {q0, q1, t0, dur}

function rot(p) { return qapply(q, p); }
let cyOff = 0; // sphere lifts while a pillar window is open
function project(v, rad) {
  const s = F / (F - v.z * rad);
  return { px: CX + v.x * rad * R * s, py: CY + cyOff - v.y * rad * R * s, s, z: v.z };
}

// --- interaction ---
canvas.addEventListener("pointerdown", e => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add("dragging");
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  lastX = e.clientX; lastY = e.clientY;
  anim = null;
  // rotate about screen axes, unbounded in every direction
  const d = qmul(qaxis(0, 1, 0, dx * 0.005), qaxis(1, 0, 0, dy * 0.005));
  q = qnorm(qmul(d, q));
});
canvas.addEventListener("pointerup", e => {
  dragging = false; canvas.classList.remove("dragging");
  if (moved < 6 && sel !== null) closePanel(); // plain click on empty space closes
});

// --- select / close ---
function select(i) {
  sel = i;
  // target: shortest rotation bringing this node to the front (0,0,1)
  const c = qapply(q, nodes[i]);
  const dot = Math.max(-1, Math.min(1, c.z));           // dot(c, front)
  let r;
  if (dot > 0.99999) r = [1, 0, 0, 0];                  // already facing us
  else if (dot < -0.99999) r = qaxis(0, 1, 0, Math.PI); // antipodal, any perpendicular axis
  else {
    const ax = c.y, ay = -c.x, az = 0;                  // cross(c, front)
    const l = Math.hypot(ax, ay, az);
    r = qaxis(ax / l, ay / l, az / l, Math.acos(dot));
  }
  anim = { q0: q, q1: qnorm(qmul(r, q)), t0: performance.now(), dur: 850 };

  fillPanel(i);
  const pnl = document.getElementById("panel");
  pnl.classList.add("open");
  pnl.scrollTop = 0;
  setCounter(L(i).title, COST[i], true, GAIN[i]);
  markRead(i);
  tags.forEach((t, k) => t.classList.toggle("sel", k === i));
}
function fillPanel(i) {
  const pl = L(i);
  document.getElementById("pEyebrow").textContent = UI[lang].axe + " " + PILLARS[i].axis + " · " + UI[lang].pilier + " " + (i + 1);
  document.getElementById("pTitle").textContent = pl.title;
  document.getElementById("pPoints").innerHTML = pl.points.map(pt => "<li>" + pt + "</li>").join("");
}
function closePanel() {
  sel = null; anim = null;
  document.getElementById("panel").classList.remove("open");
  document.getElementById("panel").scrollTop = 0;
  setCounter(UI[lang].total, TOTAL, false, TOTAL_GAIN);
  tags.forEach(t => t.classList.remove("sel"));
}

// --- language switch ---
const langBtn = document.getElementById("langBtn");
function applyLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.getElementById("hTitle").textContent = UI[l].title;
  langBtn.textContent = l.toUpperCase();
  gMax.textContent = fmtVal(curVal);
  gGain.textContent = fmtVal(curGain);
  document.getElementById("gCostTag").textContent = UI[l].cost;
  document.getElementById("gGainTag").textContent = UI[l].gain;
  const S = SOURCES[l];
  document.getElementById("sBtn").textContent = S.btn;
  document.getElementById("sPop").innerHTML =
    S.groups.map(g => "<h4>" + g.h + "</h4><ul>" +
      g.items.map(it => '<li><a href="' + it.u + '" target="_blank" rel="noopener noreferrer">' +
        it.t + "</a></li>").join("") + "</ul>").join("") +
    '<p class="note">' + S.note + "</p>";
  tags.forEach((el, i) => { el.innerHTML = tagHTML(i); });
  if (sel !== null) { fillPanel(sel); cLabel.textContent = L(sel).title; }
  else cLabel.textContent = UI[l].total;
}
langBtn.addEventListener("click", () => applyLang(lang === "fr" ? "en" : "fr"));

const panelEl = document.getElementById("panel");
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

// --- render loop ---
function frame(now) {
  // ease the sphere upward so the pillar window has room below it
  const cyTarget = sel !== null ? -H * 0.17 : 0;
  cyOff += (cyTarget - cyOff) * 0.08;

  if (anim) {
    const k = Math.min(1, (now - anim.t0) / anim.dur);
    const e = 1 - Math.pow(1 - k, 3);
    q = qslerp(anim.q0, anim.q1, e);
    if (k >= 1) { q = anim.q1; anim = null; }
  } else if (!dragging && sel === null) {
    q = qnorm(qmul(qaxis(0, 1, 0, AUTO), q));
  }

  ctx.clearRect(0, 0, W, H);

  // rotate + project all nodes
  const proj = nodes.map(n => project(rot(n), n.rad));

  // edges
  edges.forEach(([a, b]) => {
    const A = proj[a], B = proj[b];
    const zm = (A.z + B.z) / 2;
    const alpha = zm > 0 ? 0.05 + zm * 0.20 : 0.035 + zm * 0.03;
    if (alpha <= 0.012) return;
    ctx.strokeStyle = "rgba(22,22,22," + alpha.toFixed(3) + ")";
    ctx.lineWidth = zm > 0 ? 0.7 : 0.45;
    ctx.beginPath(); ctx.moveTo(A.px, A.py); ctx.lineTo(B.px, B.py); ctx.stroke();
  });

  // node dots
  proj.forEach((P, i) => {
    const front = P.z > 0;
    const r = (nodes[i].pillar >= 0 ? 2.6 : 1.7) * P.s;
    ctx.fillStyle = "rgba(22,22,22," + (front ? 0.28 + P.z * 0.6 : 0.10).toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(P.px, P.py, r, 0, 7); ctx.fill();
  });

  // pillar tags
  for (let i = 0; i < 30; i++) {
    const P = proj[i];
    const el = tags[i];
    const front = P.z > -0.15;
    const sc = 0.72 + Math.max(0, P.z) * 0.38;
    el.style.transform = "translate(-50%, -160%) translate(" + P.px.toFixed(1) + "px," + P.py.toFixed(1) + "px) scale(" + sc.toFixed(3) + ")";
    el.style.opacity = front ? (0.35 + Math.max(0, P.z) * 0.65).toFixed(2) : "0.07";
    el.style.pointerEvents = front ? "auto" : "none";
    el.style.zIndex = String(100 + Math.round(P.z * 100));
  }

  // keep the pillar window tethered under its node, clamped to the viewport
  if (sel !== null) {
    const tagRect = tags[sel].getBoundingClientRect();
    const pw = panelEl.offsetWidth, ph = panelEl.offsetHeight;
    const M = 16;
    let x = tagRect.left;                    // flush with the tag's left edge
    x = Math.max(M, Math.min(W - pw - M, x));
    let y = tagRect.bottom + 10;             // hang just under the tag
    if (y + ph > H - M) y = Math.max(M, H - ph - M);
    panelEl.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
  }

  requestAnimationFrame(frame);
}

applyLang(lang);
setCounter(UI[lang].total, TOTAL, false, TOTAL_GAIN);
requestAnimationFrame(frame);

// ---- intro: typewriter, hold 3s, then reveal the sphere ----
(function intro() {
  const L1 = "Claude,";
  const L2 = "Que ferais-tu si tu étais élu président en 2027 ?";
  const SPEED = 52, HOLD = 3000;
  const introEl = document.getElementById("intro");
  const t1 = document.getElementById("t1"), t2 = document.getElementById("t2");
  const c1 = document.getElementById("c1"), c2 = document.getElementById("c2");
  let done = false;
  const timers = [];

  function reveal() {
    if (done) return;
    done = true;
    timers.forEach(clearTimeout);
    c1.classList.remove("on"); c2.classList.remove("on");
    introEl.classList.add("done");
    document.body.classList.remove("booting");
  }

  function type(el, cur, text, then) {
    cur.classList.add("on");
    let i = 0;
    (function step() {
      if (done) return;
      el.textContent = text.slice(0, ++i);
      if (i < text.length) timers.push(setTimeout(step, SPEED));
      else { cur.classList.remove("on"); then(); }
    })();
  }

  // let an impatient visitor skip straight through
  ["click", "keydown", "touchstart"].forEach(ev =>
    introEl.addEventListener(ev, reveal, { once: true }));

  timers.push(setTimeout(() =>
    type(t1, c1, L1, () =>
      timers.push(setTimeout(() =>
        type(t2, c2, L2, () => {
          document.getElementById("flag").classList.add("in");
          timers.push(setTimeout(reveal, HOLD));
        }), 420))
    ), 500));
})();
</script>
