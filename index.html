<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>France 2027–2034 — Programme</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #161616;
    --paper: #f7f6f2;
    --mute: #9a9a9a;
    --line: #e6e4de;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--paper);
    background-image: radial-gradient(ellipse at 50% 42%, #ffffff 0%, var(--paper) 62%, #edece7 100%);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    letter-spacing: -0.01em;
  }

  /* corner frame */
  .frame { position: fixed; font-size: 10px; color: var(--mute); letter-spacing: 0.05em; z-index: 40; pointer-events: none; }
  .frame.tl { top: 30px; left: 36px; }
  .frame.tc { top: 30px; left: 50%; transform: translateX(-50%); }
  .frame.bl { bottom: 30px; left: 36px; }
  .frame.bc { bottom: 30px; left: 50%; transform: translateX(-50%); }

  /* canvas + label layer */
  #scene { position: fixed; inset: 0; cursor: grab; }
  #scene.dragging { cursor: grabbing; }
  #tags { position: fixed; inset: 0; pointer-events: none; }
  .tag {
    position: absolute; left: 0; top: 0;
    background: #161616; color: #f7f6f2;
    font-size: 10px; letter-spacing: 0.02em;
    padding: 3px 8px 4px; white-space: nowrap;
    pointer-events: auto; cursor: pointer;
    will-change: transform, opacity;
    transition: background 0.15s ease;
    user-select: none;
  }
  .tag:hover { background: #000; }
  .tag.sel { outline: 1px solid #161616; outline-offset: 2px; }
  .tag .n { color: #8f8f8f; margin-right: 6px; }
  .tag .tick { display: none; margin-left: 6px; color: #b9b5ab; font-size: 9px; }
  .tag.read .tick { display: inline; }

  /* spend counter */
  .counter {
    position: fixed; top: 26px; right: 36px; width: 232px; z-index: 60;
  }
  .counter .c-label {
    font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--mute); margin-bottom: 7px; min-height: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .counter.pillar .c-label { color: var(--ink); }
  .counter .c-value {
    font-size: 24px; font-weight: 600; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .counter .c-value .c-unit { font-size: 11px; color: var(--mute); font-weight: 400; margin-left: 5px; }
  .counter .gauge {
    margin-top: 12px; height: 34px; border-radius: 9px;
    background: rgba(0,0,0,0.045); border: 1px solid var(--line);
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: flex-end;
  }
  .counter .gauge .fill {
    position: absolute; top: 0; left: 0; height: 100%;
    background: #ddd9d0; border-radius: 9px; min-width: 8px;
    transition: width 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .counter .gauge .fill::after {
    content: ""; position: absolute; right: 0; top: 50%;
    transform: translateY(-50%); width: 2px; height: 60%;
    background: #b3afa6; border-radius: 2px;
  }
  .counter .gauge .g-max {
    position: relative; z-index: 1; padding-right: 12px;
    font-size: 12px; color: #8f8f8f; font-variant-numeric: tabular-nums;
  }
  .counter .c-foot { margin-top: 6px; font-size: 9px; color: var(--mute); }

  /* context panel */
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 92vw;
    background: rgba(247, 246, 242, 0.96);
    backdrop-filter: blur(6px);
    border-left: 1px solid var(--line);
    z-index: 50; overflow-y: auto;
    padding: 128px 34px 44px;
    transform: translateX(102%);
    transition: transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .panel.open { transform: translateX(0); }
  .panel .close {
    position: absolute; top: 92px; right: 30px;
    background: none; border: none; cursor: pointer;
    font-size: 18px; color: var(--mute); line-height: 1;
    font-family: inherit;
  }
  .panel .close:hover { color: var(--ink); }
  .panel .eyebrow {
    font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--mute); margin-bottom: 10px;
  }
  .panel h1 {
    font-size: 21px; font-weight: 600; letter-spacing: -0.02em;
    line-height: 1.15; margin-bottom: 26px; padding-right: 20px;
  }
  .points { list-style: none; counter-reset: pt; }
  .points li {
    counter-increment: pt;
    display: grid; grid-template-columns: 24px 1fr;
    gap: 12px; padding: 12px 0;
    border-top: 1px solid var(--line);
    font-size: 12.5px; line-height: 1.55;
  }
  .points li:last-child { border-bottom: 1px solid var(--line); }
  .points li::before {
    content: counter(pt, decimal-leading-zero);
    font-size: 10px; color: var(--mute); padding-top: 2px;
  }

  /* hint */
  .hint {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: var(--mute); letter-spacing: 0.04em; z-index: 40;
    pointer-events: none; transition: opacity 0.4s ease;
  }
  .hint.hide { opacity: 0; }

  ::selection { background: #161616; color: #fff; }
</style>
</head>

const cLabel = document.getElementById("cLabel");

const gaugeFill = document.getElementById("gaugeFill");
const counterEl = document.getElementById("counter");

let curVal = 0, tweenId = 0;
function setCounter(scope, val, isPillar) {
  cLabel.textContent = scope;
  counterEl.classList.toggle("pillar", !!isPillar);
  gaugeFill.style.width = Math.max(3, (val / TOTAL) * 100) + "%";
  const from = curVal, to = val, t0 = performance.now(), dur = 620;
  cancelAnimationFrame(tweenId);
  (function step(now) {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    const v = from + (to - from) * e;
    cValue.textContent = v.toFixed(1).replace(".", ",");
    if (k < 1) tweenId = requestAnimationFrame(step);
    else curVal = to;
  })(t0);
}

// ================= 3D network sphere =================
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const tagLayer = document.getElementById("tags");
let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, R = 0;
const F = 3.6; // perspective distance (sphere radii)

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  R = Math.min(W, H) * 0.34;
}
window.addEventListener("resize", resize);
resize();

// --- nodes: 30 pillar nodes (fibonacci sphere) + decorative nodes ---
function fib(i, n) {
  const g = Math.PI * (3 - Math.sqrt(5));
  const y = 1 - (i / (n - 1)) * 2;
  const r = Math.sqrt(1 - y * y);
  const a = g * i;
  return { x: Math.cos(a) * r, y, z: Math.sin(a) * r };
}
// deterministic pseudo-random
let seed = 42;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

// pillars grouped by axe: 6 cluster centers, each axe's pillars form a cap around its center
const nodes = [];
{
  const AXE_ORDER = ["I","II","III","IV","V","VI"];
  const norm = v => { const L = Math.hypot(v.x, v.y, v.z); return { x: v.x/L, y: v.y/L, z: v.z/L }; };
  const cross = (a, b) => ({ x: a.y*b.z - a.z*b.y, y: a.z*b.x - a.x*b.z, z: a.x*b.y - a.y*b.x });
  AXE_ORDER.forEach((ax, ci) => {
    const c = fib(ci, 6);
    const up = Math.abs(c.y) > 0.9 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 1, z: 0 };
    const u = norm(cross(up, c));
    const v = cross(c, u);
    const members = [];
    PILLARS.forEach((p, i) => { if (p.axis === ax) members.push(i); });
    members.forEach((pi, j) => {
      if (j === 0) { nodes[pi] = { ...c, pillar: pi, rad: 1 }; return; }
      const a = 0.40; // cap angular radius
      const phi = (2 * Math.PI * (j - 1)) / (members.length - 1) + ci * 0.7;
      const ca = Math.cos(a), sa = Math.sin(a), cf = Math.cos(phi), sf = Math.sin(phi);
      nodes[pi] = {
        x: ca * c.x + sa * (cf * u.x + sf * v.x),
        y: ca * c.y + sa * (cf * u.y + sf * v.y),
        z: ca * c.z + sa * (cf * u.z + sf * v.z),
        pillar: pi, rad: 1
      };
    });
  });
}
// decorative nodes — on the sphere surface, filling the gaps
for (let i = 0; i < 70; i++) {
  const p = fib(i, 70);
  const j = 0.18;
  let x = p.x + (rnd() - 0.5) * j, y = p.y + (rnd() - 0.5) * j, z = p.z + (rnd() - 0.5) * j;
  const L = Math.hypot(x, y, z); x /= L; y /= L; z /= L;
  nodes.push({ x, y, z, pillar: -1, rad: 1 });
}

// --- edges: k nearest neighbors → connected triangulated mesh ---
const edges = [];
{
  const seen = new Set();
  const add = (ia, ib) => {
    const key = ia < ib ? ia + "-" + ib : ib + "-" + ia;
    if (!seen.has(key)) { seen.add(key); edges.push([ia, ib]); }
  };
  nodes.forEach((a, ia) => {
    const dists = nodes.map((b, ib) => ({ ib, d: (a.x-b.x)**2 + (a.y-b.y)**2 + (a.z-b.z)**2 }))
      .filter(o => o.ib !== ia).sort((p, q) => p.d - q.d);
    const k = a.pillar >= 0 ? 2 : 8; // dense mesh between deco nodes, light anchoring for pillars
    for (let n = 0; n < k; n++) add(ia, dists[n].ib);
  });
  // pillars of the same axe: perimeter ring only (no hub spokes — too messy)
  const byAxe = {};
  PILLARS.forEach((p, i) => (byAxe[p.axis] = byAxe[p.axis] || []).push(i));
  Object.values(byAxe).forEach(m => {
    for (let j = 1; j < m.length; j++) add(m[j], m[j === m.length - 1 ? 1 : j + 1]);
  });
}

// --- pillar tags (HTML) ---
const tags = [];
let read = new Set();
try { read = new Set(JSON.parse(localStorage.getItem("readPillars") || "[]")); } catch (e) {}
PILLARS.forEach((p, i) => {
  const el = document.createElement("div");
  el.className = "tag" + (read.has(i) ? " read" : "");
  el.innerHTML = '<span class="n">' + String(i + 1).padStart(2, "0") + '</span>' + p.short + '<span class="tick">✓</span>';
  el.addEventListener("click", (e) => { e.stopPropagation(); select(i); });
  tagLayer.appendChild(el);
  tags.push(el);
});
function markRead(i) {
  if (read.has(i)) return;
  read.add(i);
  tags[i].classList.add("read");
  try { localStorage.setItem("readPillars", JSON.stringify([...read])); } catch (e) {}
}

// --- rotation state ---
let yaw = 0.6, pitch = -0.18;
const AUTO = 0.0016;
let dragging = false, lastX = 0, lastY = 0, moved = 0;
let sel = null;
let anim = null; // {y0,p0,y1,p1,t0,dur}

function rot(p) {
  const cyw = Math.cos(yaw), syw = Math.sin(yaw);
  const x = p.x * cyw + p.z * syw;
  const z = -p.x * syw + p.z * cyw;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  return { x, y: p.y * cp - z * sp, z: p.y * sp + z * cp };
}
let cxOff = 0; // sphere shifts left while the panel is open
function project(v, rad) {
  const s = F / (F - v.z * rad);
  return { px: CX + cxOff + v.x * rad * R * s, py: CY - v.y * rad * R * s, s, z: v.z };
}

// --- interaction ---
canvas.addEventListener("pointerdown", e => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add("dragging");
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  lastX = e.clientX; lastY = e.clientY;
  anim = null;
  yaw += dx * 0.005;
  pitch = Math.max(-1.2, Math.min(1.2, pitch + dy * 0.005));
});
canvas.addEventListener("pointerup", e => {
  dragging = false; canvas.classList.remove("dragging");
  if (moved < 6 && sel !== null) closePanel(); // plain click on empty space closes
});

// --- select / close ---
function select(i) {
  sel = i;
  const p = nodes[i];
  // target: rotate node to front-center → yaw = atan2(-x, z), pitch = atan2(y, hypot(x,z))
  let ty = Math.atan2(-p.x, p.z);
  const tp = Math.atan2(p.y, Math.hypot(p.x, p.z));
  // shortest path for yaw
  const d = ((ty - yaw) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
  ty = yaw + d;
  anim = { y0: yaw, p0: pitch, y1: ty, p1: tp, t0: performance.now(), dur: 850 };

  const pl = PILLARS[i];
  document.getElementById("pEyebrow").textContent = "Axe " + pl.axis + " · Pilier " + (i + 1);
  document.getElementById("pTitle").textContent = pl.title;
  document.getElementById("pPoints").innerHTML = pl.points.map(pt => "<li>" + pt + "</li>").join("");
  document.getElementById("panel").classList.add("open");
  document.getElementById("hint").classList.add("hide");
  setCounter(pl.title, SPEND[i], true);
  markRead(i);
  tags.forEach((t, k) => t.classList.toggle("sel", k === i));
}
function closePanel() {
  sel = null; anim = null;
  document.getElementById("panel").classList.remove("open");
  setCounter("Programme total", TOTAL, false);
  tags.forEach(t => t.classList.remove("sel"));
}
document.getElementById("panelClose").addEventListener("click", close);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

// --- render loop ---
function frame(now) {
  // ease sphere center toward its target (left when panel open)
  const panelW = Math.min(400, W * 0.92);
  const cxTarget = sel !== null ? -panelW / 2 : 0;
  cxOff += (cxTarget - cxOff) * 0.08;

  if (anim) {
    const k = Math.min(1, (now - anim.t0) / anim.dur);
    const e = 1 - Math.pow(1 - k, 3);
    yaw = anim.y0 + (anim.y1 - anim.y0) * e;
    pitch = anim.p0 + (anim.p1 - anim.p0) * e;
    if (k >= 1) anim = null;
  } else if (!dragging && sel === null) {
    yaw += AUTO;
  }

  ctx.clearRect(0, 0, W, H);

  // rotate + project all nodes
  const proj = nodes.map(n => project(rot(n), n.rad));

  // edges
  edges.forEach(([a, b]) => {
    const A = proj[a], B = proj[b];
    const zm = (A.z + B.z) / 2;
    const alpha = zm > 0 ? 0.05 + zm * 0.20 : 0.035 + zm * 0.03;
    if (alpha <= 0.012) return;
    ctx.strokeStyle = "rgba(22,22,22," + alpha.toFixed(3) + ")";
    ctx.lineWidth = zm > 0 ? 0.7 : 0.45;
    ctx.beginPath(); ctx.moveTo(A.px, A.py); ctx.lineTo(B.px, B.py); ctx.stroke();
  });

  // node dots
  proj.forEach((P, i) => {
    const front = P.z > 0;
    const r = (nodes[i].pillar >= 0 ? 2.6 : 1.7) * P.s;
    ctx.fillStyle = "rgba(22,22,22," + (front ? 0.28 + P.z * 0.6 : 0.10).toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(P.px, P.py, r, 0, 7); ctx.fill();
  });

  // pillar tags
  for (let i = 0; i < 30; i++) {
    const P = proj[i];
    const el = tags[i];
    const front = P.z > -0.15;
    const sc = 0.72 + Math.max(0, P.z) * 0.38;
    el.style.transform = "translate(-50%, -160%) translate(" + P.px.toFixed(1) + "px," + P.py.toFixed(1) + "px) scale(" + sc.toFixed(3) + ")";
    el.style.opacity = front ? (0.35 + Math.max(0, P.z) * 0.65).toFixed(2) : "0.07";
    el.style.pointerEvents = front ? "auto" : "none";
    el.style.zIndex = String(100 + Math.round(P.z * 100));
  }

  requestAnimationFrame(frame);
}

setCounter("Programme total", TOTAL, false);
requestAnimationFrame(frame);
</script>
</body>
</html>
